[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "foreign-trade-enterprise-rag"
version = "1.0.0"
description = "Traceable RAG assistant for foreign-trade enterprise knowledge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastembed>=0.8,<0.9",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.3,<1",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.14,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
foreign-trade-rag = "app.cli:main"
foreign-trade-ingest = "app.ingestion.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=app --cov-report=term-missing"
markers = [
  "integration: uses SQLite and an in-memory Qdrant collection",
]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
